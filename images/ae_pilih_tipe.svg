<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 365" width="1030" height="365" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37352f"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9730d"/></marker></defs><rect width="1030" height="365" fill="#ffffff"/><rect x="15" y="145" width="150" height="80" rx="10" fill="#f1f1ef" stroke="#8a8882" stroke-width="2"/><text x="90.0" y="180.0" font-size="16" fill="#37352f" font-weight="700" text-anchor="middle">Apa tugas</text><text x="90.0" y="202.0" font-size="16" fill="#37352f" font-weight="700" text-anchor="middle">di kasusnya?</text><path d="M165 185 L205 185 L205 50 L225 50" fill="none" stroke="#37352f" stroke-width="2.5" marker-end="url(#a)"/><rect x="227" y="15" width="475" height="70" rx="8" fill="#ffffff" stroke="#8a8882" stroke-width="2"/><text x="464" y="56" font-size="15" fill="#37352f" font-weight="400" text-anchor="middle">Meringkas data, mendeteksi anomali, atau mencari yang mirip</text><path d="M702 50 L758 50" fill="none" stroke="#37352f" stroke-width="2.5" marker-end="url(#a)"/><rect x="760" y="15" width="255" height="70" rx="10" fill="#e7f3f8" stroke="#2f6fb0" stroke-width="2"/><text x="887.5" y="45.0" font-size="18" fill="#2f6fb0" font-weight="700" text-anchor="middle">Vanilla</text><text x="887.5" y="67.0" font-size="14" fill="#37352f" font-weight="400" text-anchor="middle">Latent lebih kecil</text><path d="M165 185 L205 185 L205 136 L225 136" fill="none" stroke="#37352f" stroke-width="2.5" marker-end="url(#a)"/><rect x="227" y="101" width="475" height="70" rx="8" fill="#ffffff" stroke="#8a8882" stroke-width="2"/><text x="464" y="142" font-size="15" fill="#37352f" font-weight="400" text-anchor="middle">Mengembalikan data berbintik menjadi bersih</text><path d="M702 136 L758 136" fill="none" stroke="#37352f" stroke-width="2.5" marker-end="url(#a)"/><rect x="760" y="101" width="255" height="70" rx="10" fill="#edf3ec" stroke="#448361" stroke-width="2"/><text x="887.5" y="131.0" font-size="18" fill="#448361" font-weight="700" text-anchor="middle">Denoising</text><text x="887.5" y="153.0" font-size="14" fill="#37352f" font-weight="400" text-anchor="middle">Input bernoise, target bersih</text><path d="M165 185 L205 185 L205 222 L225 222" fill="none" stroke="#37352f" stroke-width="2.5" marker-end="url(#a)"/><rect x="227" y="187" width="475" height="70" rx="8" fill="#ffffff" stroke="#8a8882" stroke-width="2"/><text x="464" y="228" font-size="15" fill="#37352f" font-weight="400" text-anchor="middle">Memisahkan fitur, atau butuh latent lebih besar dari input</text><path d="M702 222 L758 222" fill="none" stroke="#37352f" stroke-width="2.5" marker-end="url(#a)"/><rect x="760" y="187" width="255" height="70" rx="10" fill="#fbecdd" stroke="#d9730d" stroke-width="2"/><text x="887.5" y="217.0" font-size="18" fill="#d9730d" font-weight="700" text-anchor="middle">Sparse</text><text x="887.5" y="239.0" font-size="14" fill="#37352f" font-weight="400" text-anchor="middle">Boleh overcomplete</text><path d="M165 185 L205 185 L205 308 L225 308" fill="none" stroke="#37352f" stroke-width="2.5" marker-end="url(#a)"/><rect x="227" y="273" width="475" height="70" rx="8" fill="#ffffff" stroke="#8a8882" stroke-width="2"/><text x="464" y="314" font-size="15" fill="#37352f" font-weight="400" text-anchor="middle">Membuat data baru yang belum ada</text><path d="M702 308 L758 308" fill="none" stroke="#37352f" stroke-width="2.5" marker-end="url(#a)"/><rect x="760" y="273" width="255" height="70" rx="10" fill="#f4f0f7" stroke="#6940a5" stroke-width="2"/><text x="887.5" y="303.0" font-size="18" fill="#6940a5" font-weight="700" text-anchor="middle">VAE</text><text x="887.5" y="325.0" font-size="14" fill="#37352f" font-weight="400" text